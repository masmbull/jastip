<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220" viewBox="0 0 920 220" role="img" aria-label="NITIP DI END">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF6EF"/>
      <stop offset="100%" stop-color="#FFF7D6"/>
    </linearGradient>
    <style>
      .brand { font: 800 54px 'Segoe UI', system-ui, sans-serif; fill: #141414; }
      .tag { font: 700 20px 'Segoe UI', system-ui, sans-serif; fill: #475569; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .slide { animation: slide 3.2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes slide { 0%,100% { transform: translateX(0); } 50% { transform: translateX(10px); } }
    </style>
  </defs>
  <rect width="920" height="220" rx="24" fill="url(#bg)" stroke="#141414" stroke-width="6"/>
  <g class="pulse" style="transform-origin: 104px 106px">
    <rect x="56" y="58" width="96" height="96" rx="18" fill="#FFC800" stroke="#141414" stroke-width="5"/>
    <text x="104" y="122" text-anchor="middle" font-size="52" font-weight="900" fill="#141414">N</text>
  </g>
  <text class="brand" x="180" y="105">NITIP DI END</text>
  <text class="tag" x="180" y="142">Jastip lokal · katalog · invoice · ongkir · PWA</text>
  <g class="slide">
    <rect x="700" y="78" width="160" height="56" rx="12" fill="#FFC800" stroke="#141414" stroke-width="4"/>
    <text x="780" y="114" text-anchor="middle" font-size="20" font-weight="800" fill="#141414">EH, NITIP!</text>
  </g>
</svg>
