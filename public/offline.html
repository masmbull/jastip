<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#FFC800">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Offline — NITIP DI END</title>
    <link rel="icon" href="/images/icons/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="manifest" href="/manifest.webmanifest">
    <style>
        :root {
            --cream: #FAF6EF;
            --ink: #141414;
            --yellow: #FFC800;
            --muted: #475569;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            font-family: "DM Sans", system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(circle at 12% 18%, rgba(255, 200, 0, 0.28), transparent 42%),
                radial-gradient(circle at 88% 78%, rgba(20, 20, 20, 0.06), transparent 40%),
                var(--cream);
            color: var(--ink);
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border: 2px solid var(--ink);
            border-radius: 12px;
            box-shadow: 6px 6px 0 var(--ink);
            padding: 1.75rem 1.5rem;
            text-align: center;
        }
        .mark {
            width: 64px;
            height: 64px;
            margin: 0 auto 1rem;
            display: grid;
            place-items: center;
            background: var(--yellow);
            border: 2px solid var(--ink);
            border-radius: 10px;
            box-shadow: 3px 3px 0 var(--ink);
            font-weight: 900;
            font-size: 1.5rem;
        }
        h1 {
            margin: 0;
            font-family: "Bricolage Grotesque", system-ui, sans-serif;
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        p {
            margin: 0.65rem 0 0;
            color: var(--muted);
            font-weight: 500;
            line-height: 1.45;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            justify-content: center;
            margin-top: 1.25rem;
        }
        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0.65rem 1.15rem;
            border: 2px solid var(--ink);
            border-radius: 8px;
            box-shadow: 3px 3px 0 var(--ink);
            text-decoration: none;
            font-weight: 800;
            color: var(--ink);
            background: var(--yellow);
        }
        a.ghost { background: #fff; }
    </style>
</head>
<body>
    <main class="card">
        <div class="mark" aria-hidden="true">N</div>
        <h1>Kamu sedang offline</h1>
        <p>Halaman ini belum ada di cache. Cek koneksi, lalu buka ulang toko atau panel admin.</p>
        <div class="actions">
            <a href="/" onclick="location.reload()">Coba lagi</a>
            <a class="ghost" href="/">Ke beranda</a>
        </div>
    </main>
    <script>
        if (navigator.onLine) location.reload();
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
