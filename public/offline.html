<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f43f5e">
    <title>Offline — NITIP DI END</title>
    <link rel="icon" href="/images/icons/favicon-16.png" type="image/png" sizes="16x16">
    <link rel="manifest" href="/manifest.webmanifest">
    <style>
        body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#faf7f2;color:#333;display:flex;align-items:center;justify-content:center;min-height:100vh}
        .card{text-align:center;background:#fff;padding:2.5rem 1.5rem;border-radius:1.5rem;box-shadow:0 10px 25px rgba(0,0,0,.08);max-width:420px}
        .ico{width:72px;height:72px;margin:0 auto 1rem;background:#fecdd3;border-radius:1rem}
        h1{font-size:1.5rem;font-weight:700;margin:.5rem 0}
        p{margin:.5rem 0;color:#666}
        a{display:inline-flex;align-items:center;justify-content:center;margin-top:1rem;padding:.7rem 1.4rem;background:#f43f5e;color:#fff;font-weight:600;border-radius:9999px;text-decoration:none;transition;background:.2s}
        a:hover{background:#e11d1d}
    </style>
</head>
<body>
    <div class="card">
        <div class="ico">📦</div>
        <h1>Kamu sedang offline</h1>
        <p>Halaman ini belum tersedia di cache. Periksa koneksi internetmu lalu coba lagi.</p>
        <a href="/" onclick="location.reload()">Coba Lagi</a>
    </div>
    <script>
        if (navigator.onLine) { location.reload(); }
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
