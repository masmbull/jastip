<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 72" width="260" height="72">
  <!-- SeaBank Indonesia official logo: orange S-wave mark + SeaBank text -->
  <!-- Official colors: #FF6B00 orange, #1A1A2E dark navy -->
  <g>
    <!-- S-wave mark (simplified official wave/sea symbol) -->
    <path d="M8,52 C8,52 14,28 26,28 C38,28 38,48 50,48 C62,48 62,28 74,28" 
          fill="none" stroke="#FF6B00" stroke-width="8" stroke-linecap="round"/>
    <path d="M8,40 C8,40 14,16 26,16 C38,16 38,36 50,36 C62,36 62,16 74,16" 
          fill="none" stroke="#FF6B00" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  </g>
  <!-- SeaBank text -->
  <text x="86" y="50" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#1A1A2E" letter-spacing="-0.5">Sea</text>
  <text x="138" y="50" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#FF6B00" letter-spacing="-0.5">Bank</text>
</svg>
