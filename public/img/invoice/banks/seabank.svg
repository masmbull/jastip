<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80">
  <!-- SeaBank Indonesia logo: orange S-wave + SeaBank wordmark -->
  <!-- Official brand colors: orange #FF5722, dark #1B1F2E -->
  <defs>
    <style>
      .sea-dark { font-family: Arial, Helvetica, sans-serif; font-weight: 800; font-size: 36px; fill: #1B1F2E; }
      .sea-orange { font-family: Arial, Helvetica, sans-serif; font-weight: 800; font-size: 36px; fill: #FF5722; }
    </style>
  </defs>
  <!-- Wave mark: two wave lines forming S-shape -->
  <path d="M10,28 C10,28 22,12 34,12 C46,12 46,32 58,32 C70,32 70,12 82,12 C90,12 94,18 98,22"
        fill="none" stroke="#FF5722" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M10,52 C10,52 22,36 34,36 C46,36 46,56 58,56 C70,56 70,36 82,36 C90,36 94,42 98,46"
        fill="none" stroke="#FF5722" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- SeaBank text -->
  <text x="114" y="54" class="sea-dark">Sea</text>
  <text x="192" y="54" class="sea-orange">Bank</text>
</svg>
