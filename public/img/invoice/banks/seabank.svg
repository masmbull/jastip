<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160">
  <!-- SeaBank official logo: orange circle with S + SeaBank text + blue wave -->
  <!-- Orange circle background -->
  <circle cx="72" cy="68" r="62" fill="#FF6200"/>
  <!-- White S letter -->
  <text x="72" y="95" font-family="Arial Black,Arial,sans-serif" font-size="72" font-weight="900"
        fill="#FFFFFF" text-anchor="middle">S</text>
  <!-- SeaBank orange text -->
  <text x="155" y="85" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="800"
        fill="#FF6200">SeaBank</text>
  <!-- Blue wave lines below -->
  <path d="M155,110 Q195,98 235,110 Q275,122 315,110 Q355,98 395,110"
        fill="none" stroke="#1A6EC8" stroke-width="7" stroke-linecap="round"/>
  <path d="M155,128 Q195,116 235,128 Q275,140 315,128 Q355,116 395,128"
        fill="none" stroke="#1A6EC8" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
</svg>
