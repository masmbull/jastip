  </g>
  <!-- BluBCA text -->
  <text x="44" y="44" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900" fill="#00447C" letter-spacing="-0.5">Blu</text>
  <text x="98" y="44" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900" fill="#00A8E0" letter-spacing="-0.5">BCA</text>
