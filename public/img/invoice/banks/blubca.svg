<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80">
  <!-- blu by BCA Digital logo -->
  <!-- Official colors: lowercase "blu" in dark teal #003B5C, "BCA" in cyan #00B8D4 -->
  <defs>
    <style>
      .blu-word { font-family: Arial Black, Arial, sans-serif; font-weight: 900; font-size: 38px; }
      .blu-dot { }
    </style>
  </defs>
  <!-- Circle mark (the "b" dot from blu logo) -->
  <circle cx="22" cy="40" r="20" fill="#00B8D4"/>
  <circle cx="22" cy="40" r="11" fill="#FFFFFF"/>
  <circle cx="22" cy="40" r="5" fill="#003B5C"/>
  <!-- "blu" lowercase dark -->
  <text x="52" y="57" class="blu-word" fill="#003B5C">blu</text>
  <!-- "BCA" uppercase cyan -->
  <text x="134" y="57" class="blu-word" fill="#00B8D4">BCA</text>
</svg>
