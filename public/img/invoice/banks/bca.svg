        fill="none" stroke="#1A3A8F" stroke-width="6" transform="translate(5,5) scale(0.85)"/>
  <!-- Flower/tree inside shield -->
  <circle cx="55" cy="70" r="18" fill="#1A3A8F"/>
  <circle cx="35" cy="90" r="14" fill="#1A3A8F"/>
  <circle cx="75" cy="90" r="14" fill="#1A3A8F"/>
  <rect x="46" y="100" width="18" height="28" rx="4" fill="#1A3A8F"/>
  <rect x="20" y="118" width="70" height="10" rx="3" fill="#1A3A8F"/>
  <text x="20" y="155" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#1A3A8F">GRUP BCA</text>
  <!-- BCA bold text -->
  <text x="125" y="130" font-family="Arial Black,Arial,sans-serif" font-size="100" font-weight="900" fill="#1A3A8F">BCA</text>
</svg>
